name: CI
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

env:
  # pnpm version comes from package.json "packageManager"; specifying it
  # here too made pnpm/action-setup@v4 fail with "multiple versions".
  NODE_VERSION: 20

# Third-party actions are pinned to full commit SHAs (the trailing comment
# names the tag the SHA was resolved from). Bump them deliberately.
# dtolnay/rust-toolchain is pinned to the commit of its `1.90.0` branch and
# also gets `toolchain:` explicitly, so the SHA pin can't drift the version.
# Pinned rather than @stable so rustfmt output is reproducible against what
# contributors run locally (rustfmt can reformat differently across
# toolchain versions). Keep in sync with rust-version in Cargo.toml.

jobs:
  guards:
    name: Guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: architecture.md changes need an [architecture] marker
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -e
          if ! git diff --name-only origin/${{ github.base_ref }}...HEAD \
               | grep -qx 'architecture.md'; then
            exit 0
          fi
          # Every commit that touches architecture.md must carry the
          # `[architecture]` marker in its subject line. Implementation PRs
          # leave architecture.md untouched; explicit architecture-update
          # PRs opt in via the marker and a maintainer review.
          violations=$(
            git log "origin/${{ github.base_ref }}..HEAD" \
                --format='%H %s' -- architecture.md \
              | grep -v '\[architecture\]' || true
          )
          if [ -n "$violations" ]; then
            echo "::error::architecture.md was modified by commits that lack the [architecture] marker:"
            echo "$violations"
            exit 1
          fi

      - name: No hex colors outside tokens.css
        shell: bash
        run: |
          set -e
          violations=$(grep -rEn '#[0-9a-fA-F]{3}([0-9a-fA-F]{3})?\b' \
            apps/desktop/src \
            --include='*.ts' --include='*.tsx' \
            --include='*.css' --include='*.scss' \
            --exclude='tokens.css' || true)
          if [ -n "$violations" ]; then
            echo "::error::Hex color literals must live only in tokens.css (see architecture.md §4.2 Theme)."
            echo "$violations"
            exit 1
          fi

      - name: No hardcoded font-family declarations
        shell: bash
        run: |
          set -e
          # font-family is allowed only when it references a --font-* token via var().
          violations=$(grep -rEn 'font-family\s*:' \
            apps/desktop/src \
            --include='*.ts' --include='*.tsx' \
            --include='*.css' --include='*.scss' \
            --exclude='tokens.css' \
            | grep -v 'var(--font-' || true)
          if [ -n "$violations" ]; then
            echo "::error::font-family must reference a --font-* token (see architecture.md §4.2 Theme)."
            echo "$violations"
            exit 1
          fi

      - name: All FS writes must go through services/fs.rs
        shell: bash
        run: |
          set -e
          violations=$(grep -rEn 'std::fs::write|fs::write\b|tokio::fs::write' \
            apps/desktop/src-tauri/src \
            --include='*.rs' \
            --exclude-dir=services || true)
          if [ -n "$violations" ]; then
            echo "::error::All writes must go through services/fs.rs::atomic_write (see architecture.md §6 Data & API Reference -> vault/wiki/concurrency-safety.md)."
            echo "$violations"
            exit 1
          fi

      - name: No package-lock.json / yarn.lock (pnpm only)
        run: |
          if [ -f package-lock.json ] || [ -f yarn.lock ]; then
            echo "::error::Repository is pnpm-only. Remove package-lock.json / yarn.lock."
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm -C apps/desktop lint
      - name: Typecheck
        run: pnpm -C apps/desktop typecheck
      - name: Unit tests (Vitest)
        run: pnpm -C apps/desktop test
      - name: Vite production build
        run: pnpm -C apps/desktop build

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Tauri v2 system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssh2-1-dev
      - uses: dtolnay/rust-toolchain@4aab473fa1157d90c6dc14f879ca54797e16fea0 # 1.90.0 branch
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
          key: rust-${{ matrix.os }}
      # Formatting is platform-independent; check it once.
      - name: cargo fmt --check
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check
      # tauri::generate_context! embeds the frontend dist at compile time,
      # so clippy/test need it to exist. This job doesn't build the
      # frontend (that's the Frontend/build jobs), so stub it.
      - name: Stub frontend dist for generate_context!
        shell: bash
        run: |
          mkdir -p apps/desktop/dist
          printf '<!doctype html><title>ci</title>' > apps/desktop/dist/index.html
      - name: cargo clippy (deny warnings)
        shell: bash
        run: |
          cargo clippy \
            --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --all-targets --all-features \
            -- -D warnings
      - name: cargo test
        shell: bash
        run: |
          cargo test \
            --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --all --all-features

  build:
    name: Build (${{ matrix.os }})
    needs: [guards, frontend, rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          # One cheap bundle per OS: enough to smoke-test packaging without
          # producing every installer format on every push.
          - os: ubuntu-latest
            bundles: deb
          - os: macos-latest
            bundles: app
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Tauri v2 system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssh2-1-dev
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4aab473fa1157d90c6dc14f879ca54797e16fea0 # 1.90.0 branch
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
          key: build-${{ matrix.os }}
      - run: pnpm install --frozen-lockfile
      - name: Tauri debug build (${{ matrix.bundles }})
        run: pnpm -C apps/desktop tauri build --debug --bundles ${{ matrix.bundles }}
