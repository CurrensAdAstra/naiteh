[package]
name = "naiteh"
version = "0.0.0"
description = "naiteh — local-first Markdown notes & journal"
repository = "https://github.com/CurrensAdAstra/naiteh"
edition = "2021"
# Locked dependencies need >= 1.88 (time, darling, plist, serde_with); CI
# pins and tests 1.90.0, so that is the declared minimum.
rust-version = "1.90"

[lib]
name = "naiteh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Opens external links from the Markdown viewer in the system browser.
# Kept on 2.5.x in step with @tauri-apps/plugin-opener in package.json.
tauri-plugin-opener = "~2.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "macros", "sync", "time"] }
git2 = { version = "0.19", default-features = false, features = ["https", "ssh"] }
thiserror = "2"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# 0.13 matches the version tauri already pulls in. `rustls` = rustls with the
# aws-lc-rs provider + OS certificate store (rustls-platform-verifier).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
sha2 = "0.10"
quick-xml = "0.36"
base64 = "0.22"
md-5 = "0.10"
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["getrandom"] }
getrandom = "0.2"
# External file-change detection for the active vault (services/watcher.rs).
# 8.2.0 was published 2025-08-03; the 9.x line is still a release candidate.
notify = "8.2"
# IANA time zones for calendar subscriptions (services/calendar.rs).
# 0.10.4 was published 2025-07-11 (MSRV 1.65).
chrono-tz = "0.10.4"
# SFTP backup target (services::backup). 0.9.5 (2025-01) shares the
# libssh2-sys 0.3.1 that git2's "ssh" feature already links.
ssh2 = "0.9.5"

# 3.6.3 was published 2025-07-27. Explicit native backends only: Linux
# uses persistent Secret Service, not the session-only kernel keyring.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"
httpmock = "0.7"

[features]
custom-protocol = ["tauri/custom-protocol"]
